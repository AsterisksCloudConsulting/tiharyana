<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Are You Interested?</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 30px;
      font-size: 24px;
    }

    button {
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .yes {
      background-color: #28a745;
      color: white;
    }

    .yes:hover {
      background-color: #218838;
    }

    .no {
      background-color: #dc3545;
      color: white;
    }

    .no:hover {
      background-color: #c82333;
    }

    .message {
      font-size: 18px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container" id="content">
    <h1 id="question">Are you interested for this job profile?</h1>
    <button class="yes" onclick="handleYes()">Yes</button>
    <button class="no" onclick="handleNo()">No</button>
    <p class="message" id="message"></p>
  </div>

  <script>
    function handleYes() {
      document.getElementById("question").textContent = "Thank you!";
      document.getElementById("message").textContent = "Awesome! We'll get in touch soon.";
      document.querySelectorAll("button").forEach(btn => btn.style.display = "none");

      // Try closing the window after 2 seconds (will only work in pop-ups)
      setTimeout(() => {
        window.open('', '_self'); // Fix for some browsers
        window.close();
      }, 2000);
    }

    function handleNo() {
      document.getElementById("question").textContent = "No worries!";
      document.getElementById("message").textContent = "Thanks for stopping by!";
      document.querySelectorAll("button").forEach(btn => btn.style.display = "none");
    }
  </script>
</body>
</html>
